name: Studio checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  studio:
    # Last green studio job ran on ubuntu-24.04 (5m12s). ubuntu-latest is
    # moving to the next LTS, which changes the ffmpeg those tests encode with.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The runner tries a regional archive first. Apt only leaves it when the
      # server goes silent, so a mirror that keeps sending slowly holds this
      # step until the 10-minute job cap. Keep the upstream archive.
      - name: Install video tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^https://archive\.ubuntu\.com/ubuntu/|!{ /archive\.ubuntu\.com/d; }' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Vendored browser engines (three, pixi.js) for the GPU example studies
        working-directory: studio
        run: node studio.mjs setup gpu
      - name: Type check (core modules, dev-only tools)
        working-directory: studio
        run: npm ci --no-audit --no-fund && npm run typecheck
      - name: Unit checks
        working-directory: studio
        run: npm run test:all
      - name: Actual browser and encoder checks
        working-directory: studio
        env:
          STUDIO_CHROMIUM: /usr/bin/google-chrome
        run: npm run test:render

  reference-python:
    # Same image as the studio job, so both checks stay on the stack that last passed.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional scientific tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^https://archive\.ubuntu\.com/ubuntu/|!{ /archive\.ubuntu\.com/d; }' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -r studio/reference/requirements-optional.txt
      - name: Python reference integration
        working-directory: studio
        env:
          REFERENCE_PYTHON_TEST: '1'
        run: node --test --test-name-pattern='optional Python engines' test/reference.test.mjs
