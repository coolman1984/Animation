<script type="module">
  // Generic composer: ?film=<module path>&w=&h=&variant=
  // Exposes window.ready (fonts + images decoded) and window.renderAt(t, frame) — pure in t.
  const q = new URLSearchParams(location.search);
  const W = +(q.get('w') || 1080), H = +(q.get('h') || 1350);
  const stage = document.getElementById('stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  // Libraries that load resources outside <img> (textures, data) register promises here; ready awaits them.
  const pending = [];
  window.studioWait = (promise) => { pending.push(promise); return promise; };
  const mod = await import(q.get('film'));
  const film = mod.default;
  await film.init(stage, { W, H, variant: q.get('variant') || 'hero' });
  // Optional cut-down: ?segments=a-b,c-d (film seconds) &fadeOut=sec — output time u maps onto the
  // film's own timeline, so a cut-down is the same deterministic picture, re-edited.
  const segs = (q.get('segments') || '').split(',').filter(Boolean).map((s) => s.split('-').map(Number));
  const total = segs.length ? segs.reduce((a, [x, y]) => a + (y - x), 0) : film.duration;
  const fadeOut = +(q.get('fadeOut') || 0);
  const veil = document.createElement('div');
  Object.assign(veil.style, { position: 'absolute', inset: '0', background: '#000', opacity: '0', pointerEvents: 'none' });

    if (!segs.length) return u;

    const t = mapT(u);
    // Re-edited segments preserve both authored time and frame-dependent motion.
    // A film may return a promise from render (live footage frames must be decoded before capture); capture awaits it.
    const done = film.render(t, segs.length ? Math.round(t * (film.fps || 30)) : (frame ?? Math.round(t * (film.fps || 30))));
    if (fadeOut) { if (!veil.parentNode) stage.appendChild(veil); veil.style.opacity = Math.min(1, Math.max(0, (u - (total - fadeOut)) / fadeOut)).toFixed(4); }
    return done && typeof done.then === 'function' ? done.then(() => true) : true;
  };

  if (typeof film.camera === 'function') window.cameraAt = (u) => film.camera(mapT(u));
  window.duration = total;
  window.fps = film.fps || 30;
  window.textBoxes = () => [...stage.querySelectorAll('.line')]
    .filter((l) => l.offsetParent !== null && getComputedStyle(l).display !== 'none' && getComputedStyle(l).visibility !== 'hidden')
    .map((l) => {

      const visibleRect = (w) => {
        const r = w.getBoundingClientRect(), c = w.parentElement;
        if (!c || !c.classList.contains('word-clip') || getComputedStyle(c).overflow !== 'hidden') return r;
        const k = c.getBoundingClientRect(), left = Math.max(r.left, k.left), top = Math.max(r.top, k.top), right = Math.min(r.right, k.right), bottom = Math.min(r.bottom, k.bottom);
        return right - left > 1 && bottom - top > 1 ? { left, top, right, bottom } : null;
      };
      const rs = [...l.querySelectorAll('.word')].filter((w) => +getComputedStyle(w).opacity > 0.5).map(visibleRect).filter(Boolean);
      if (!rs.length) return null;
      return { text: l.dataset.text || [...l.querySelectorAll('.word')].map((w) => w.textContent).join(' '), x0: Math.min(...rs.map((r) => r.left)), y0: Math.min(...rs.map((r) => r.top)), x1: Math.max(...rs.map((r) => r.right)), y1: Math.max(...rs.map((r) => r.bottom)) };
    }).filter(Boolean);
  // Scene graph for models that cannot see (lib/scenegraph.mjs): every visible thing on screen as a box with its kind, colour and
  // effective opacity, read back from the DOM after render. Text lines are one item; their words are not walked again.
  window.sceneGraph = () => {
    const out = [], S = stage.getBoundingClientRect(), area = S.width * S.height;
    const solid = (c) => c && !/^transparent$/.test(c) && !/rgba\([^)]*,\s*0(\.0+)?\)$/.test(c);
    const paint = (cs) => { const img = cs.backgroundImage;

      if (solid(cs.backgroundColor)) return { color: cs.backgroundColor };
      return cs.borderTopWidth !== '0px' && cs.borderTopStyle !== 'none' && solid(cs.borderTopColor) ? { color: cs.borderTopColor, outline: true } : null; };

        const o = op * +cs.opacity; if (o < 0.04) continue;
        const r = c.getBoundingClientRect(), x0 = Math.max(r.left, S.left) - S.left, y0 = Math.max(r.top, S.top) - S.top, x1 = Math.min(r.right, S.right) - S.left, y1 = Math.min(r.bottom, S.bottom) - S.top;
        const visible = x1 - x0 > 1 && y1 - y0 > 1, blur = +(/blur\(([\d.]+)px\)/.exec(cs.filter)?.[1] || 0);
        const box = { x0: Math.round(x0), y0: Math.round(y0), x1: Math.round(x1), y1: Math.round(y1), cut: r.left < S.left - 2 || r.top < S.top - 2 || r.right > S.right + 2 || r.bottom > S.bottom + 2, opacity: +o.toFixed(2), z: z + (+cs.zIndex || 0), ...(blur ? { blur } : {}) };
        const tag = c.tagName.toLowerCase();
        if (c.classList.contains('line')) {
          const ws = [...c.querySelectorAll('.word')].filter((w) => +getComputedStyle(w).opacity > 0.3);
          if (ws.length && visible) { const w0 = getComputedStyle(ws[0]), rs = ws.map((w) => w.getBoundingClientRect());
            const g = { x0: Math.round(Math.min(...rs.map((q) => q.left)) - S.left), y0: Math.round(Math.min(...rs.map((q) => q.top)) - S.top), x1: Math.round(Math.max(...rs.map((q) => q.right)) - S.left), y1: Math.round(Math.max(...rs.map((q) => q.bottom)) - S.top) };
            out.push({ kind: 'text', text: c.dataset.text || ws.map((w) => w.textContent).join(' '), size: Math.round(parseFloat(w0.fontSize)), weight: w0.fontWeight, font: w0.fontFamily.split(',')[0].replace(/['"]/g, ''), color: w0.color, ...box, ...g, cut: g.x0 < -2 || g.y0 < -2 || g.x1 > S.width + 2 || g.y1 > S.height + 2, opacity: +(o * +w0.opacity).toFixed(2) }); }
          continue;
        }

          if (tag === 'img') out.push({ kind: 'image', src: (c.getAttribute('src') || '').split('/').pop(), ...box });

          else { const p = paint(cs); if (p?.color) out.push({ kind: (x1 - x0) * (y1 - y0) > area * 0.9 ? 'backdrop' : p.texture ? 'texture' : p.outline ? 'outline' : 'shape', color: p.color, radius: cs.borderTopLeftRadius, ...box }); }
        }
        if (tag !== 'svg' && tag !== 'canvas') walk(c, o, box.z);
      }
    };
    walk(stage, 1, 0);
    return out;
  };
  window.ready = (async () => {
    await document.fonts.ready;
    await Promise.all([...document.fonts].map((f) => f.load()));
    await Promise.all([...stage.querySelectorAll('img')].map((i) => i.decode().catch(() => { throw new Error('image failed: ' + i.src); })));
    await Promise.all(pending);
    await window.renderAt(0);
    return { W, H, duration: total, fps: film.fps || 30, fonts: [...document.fonts].filter((f) => f.status === 'loaded').map((f) => f.family) };
  })();
</script>
