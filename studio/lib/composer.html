<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>composer</title>
<style>
  @font-face { font-family: 'El Messiri'; src: url('../assets/fonts/ElMessiri.ttf'); font-weight: 400 700; }
  @font-face { font-family: 'Aref Ruqaa'; src: url('../assets/fonts/ArefRuqaa-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Aref Ruqaa'; src: url('../assets/fonts/ArefRuqaa-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Plex Arabic'; src: url('../assets/fonts/IBMPlexSansArabic-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Plex Arabic'; src: url('../assets/fonts/IBMPlexSansArabic-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Montserrat'; src: url('../assets/fonts/Montserrat.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Archivo'; src: url('../assets/fonts/Archivo.ttf'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'Instrument Serif'; src: url('../assets/fonts/InstrumentSerif-Italic.ttf'); font-style: italic; font-weight: 400; }
  @font-face { font-family: 'Space Mono'; src: url('../assets/fonts/SpaceMono-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Space Mono'; src: url('../assets/fonts/SpaceMono-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Alexandria'; src: url('../assets/fonts/Alexandria-Arabic.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: 'Alexandria'; src: url('../assets/fonts/Alexandria-Latin.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #000; }
  #stage * { box-sizing: border-box; }
  .abs { position: absolute; left: 0; top: 0; }
  img { display: block; user-select: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
  // Generic composer: ?film=<module path>&w=&h=&variant=
  // Exposes window.ready (fonts + images decoded) and window.renderAt(t, frame) — pure in t.
  const q = new URLSearchParams(location.search);
  const W = +(q.get('w') || 1080), H = +(q.get('h') || 1350);
  const stage = document.getElementById('stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  // Libraries that load resources outside <img> (textures, data) register promises here; ready awaits them.
  const pending = [];
  window.studioWait = (promise) => { pending.push(promise); return promise; };
  const mod = await import(q.get('film'));
  const film = mod.default;
  await film.init(stage, { W, H, variant: q.get('variant') || 'hero' });
  // Optional cut-down: ?segments=a-b,c-d (film seconds) &fadeOut=sec — output time u maps onto the
  // film's own timeline, so a cut-down is the same deterministic picture, re-edited.
  const segs = (q.get('segments') || '').split(',').filter(Boolean).map((s) => s.split('-').map(Number));
  const total = segs.length ? segs.reduce((a, [x, y]) => a + (y - x), 0) : film.duration;
  const fadeOut = +(q.get('fadeOut') || 0);
  const veil = document.createElement('div');
  Object.assign(veil.style, { position: 'absolute', inset: '0', background: '#000', opacity: '0', pointerEvents: 'none' });
  const mapT = (u) => {
    if (!segs.length) return u;
    let off = 0;
    for (const [a, b] of segs) { if (u < off + (b - a) || b === segs[segs.length - 1][1]) return a + Math.min(u - off, b - a - 1e-6); off += b - a; }
    return u;
  };
  window.renderAt = (u, frame) => {
    const t = mapT(u);
    // Re-edited segments preserve both authored time and frame-dependent motion.
    film.render(t, segs.length ? Math.round(t * (film.fps || 30)) : (frame ?? Math.round(t * (film.fps || 30))));
    if (fadeOut) { if (!veil.parentNode) stage.appendChild(veil); veil.style.opacity = Math.min(1, Math.max(0, (u - (total - fadeOut)) / fadeOut)).toFixed(4); }
    return true;
  };
  // Optional: films that expose camera(t) get camera diagnostics and velocity-aware review sampling.
  if (typeof film.camera === 'function') window.cameraAt = (u) => film.camera(mapT(u));
  window.duration = total;
  window.fps = film.fps || 30;
  window.textBoxes = () => [...stage.querySelectorAll('.line')]
    .filter((l) => l.offsetParent !== null && getComputedStyle(l).display !== 'none' && getComputedStyle(l).visibility !== 'hidden')
    .map((l) => {
      // A word inside a clipping box (mask reveals) is only visible where the two rects intersect.
      const visibleRect = (w) => {
        const r = w.getBoundingClientRect(), c = w.parentElement;
        if (!c || !c.classList.contains('word-clip') || getComputedStyle(c).overflow !== 'hidden') return r;
        const k = c.getBoundingClientRect(), left = Math.max(r.left, k.left), top = Math.max(r.top, k.top), right = Math.min(r.right, k.right), bottom = Math.min(r.bottom, k.bottom);
        return right - left > 1 && bottom - top > 1 ? { left, top, right, bottom } : null;
      };
      const rs = [...l.querySelectorAll('.word')].filter((w) => +getComputedStyle(w).opacity > 0.5).map(visibleRect).filter(Boolean);
      if (!rs.length) return null;
      return { text: l.dataset.text || [...l.querySelectorAll('.word')].map((w) => w.textContent).join(' '), x0: Math.min(...rs.map((r) => r.left)), y0: Math.min(...rs.map((r) => r.top)), x1: Math.max(...rs.map((r) => r.right)), y1: Math.max(...rs.map((r) => r.bottom)) };
    }).filter(Boolean);
  window.ready = (async () => {
    await document.fonts.ready;
    await Promise.all([...document.fonts].map((f) => f.load()));
    await Promise.all([...stage.querySelectorAll('img')].map((i) => i.decode().catch(() => { throw new Error('image failed: ' + i.src); })));
    await Promise.all(pending);
    window.renderAt(0);
    return { W, H, duration: total, fps: film.fps || 30, fonts: [...document.fonts].filter((f) => f.status === 'loaded').map((f) => f.family) };
  })();
</script>
</body>
</html>
