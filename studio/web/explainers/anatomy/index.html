<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مطحنة القهوة — أجزاء</title>
<meta name="description" content="شرح تفاعلي لمطحنة قهوة: فك الأجزاء، اضغط كل قطعة لتقرأ وظيفتها، وجولة قصيرة بينها.">
<style>
  html, body { margin: 0; background: #241c16; color: #f6f0e6; }
  body { font-family: "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif; font-size: 17px; line-height: 1.5; }
  header { padding: 18px 22px 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.25; }
  header p { margin: 6px 0 0; max-width: 42rem; }
  .shell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 320px); min-height: calc(100vh - 96px); }
  .stage { position: relative; min-height: 70vh; background: #241c16; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .leaders { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
  .hotspot { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border-radius: 50%;
    border: 2px solid #f6f0e6; background: transparent; pointer-events: auto; }
  .hotspot.is-on { background: currentColor; }
  .leader { position: absolute; width: 148px; min-height: 32px; padding: 6px 10px; background: #2c241c; color: #f6f0e6;
    font-size: 16px; line-height: 1.3; pointer-events: none; }
  .panel { background: #2c241c; padding: 16px 16px 28px; }
  h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
  #note { margin: 0 0 16px; }
  label { display: block; font-size: 16px; margin-bottom: 6px; }
  input[type="range"] { width: 100%; height: 28px; }
  .tour, .part { display: block; width: 100%; min-height: 44px; margin: 8px 0 0; padding: 8px 12px; text-align: start;
    font: inherit; color: #f6f0e6; background: #241c16; border: 1px solid #6a5646; }
  .part[aria-pressed="true"] { background: #3a2e24; border-color: #e2a84a; }
  .hint { margin: 14px 0 0; font-size: 15px; color: #f0e2d2; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .stage { height: 68vh; min-height: 320px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./engine/three/build/three.module.js" } }</script>
</head>
<body>
<header>
  <h1>مطحنة القهوة</h1>
  <p>كل جزء يتحرك وحده. حرّك التفكيك، ثم اضغط القطعة.</p>
</header>
<div class="shell">
  <div class="stage" id="stage" tabindex="0" aria-label="مجسم المطحنة. الأسهم تدور، والشريط يفك الأجزاء.">
    <canvas id="view"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
  <aside class="panel">
    <h2>الوظيفة</h2>
    <p id="note">تحمل المطحنة وتمنعها من القفز على الطاولة أثناء الدوران.</p>
    <label for="explode">التفكيك</label>
    <input id="explode" type="range" min="0" max="1" step="0.01" value="0.55">
    <button type="button" class="tour" id="tour">الجولة</button>
    <div id="list"></div>
    <p class="hint">الأسهم للدوران. زائد وناقص للتفكيك.</p>
  </aside>
</div>
<script type="module">
  import { mount } from './scene.mjs';
  const data = await fetch('./parts.json').then((r) => { if (!r.ok) throw new Error('parts.json'); return r.json(); });
  const params = new URLSearchParams(location.search);
  const app = mount({
    canvas: document.getElementById('view'),
    overlay: document.getElementById('overlay'),
    note: document.getElementById('note'),
    list: document.getElementById('list'),
    explode: document.getElementById('explode'),
    data,
  });
  document.getElementById('tour').addEventListener('click', () => app.tour());
  window.anatomyRender = (t) => app.render(Number(t));
  if (params.has('t')) app.render(Number(params.get('t')));
</script>
</body>
</html>
