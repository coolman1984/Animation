<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جيبي — مثال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF0F4;--card:#fff;--ink:#14161C;--muted:#5C6270;--accent:#2F5BEA;--mint:#DDF5EA;--good:#0E8A55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Alexandria,system-ui,sans-serif}
.w{max-width:1140px;margin:auto;padding-inline:max(20px,4vw)}
.tag{position:fixed;inset:auto auto 12px 12px;background:var(--ink);color:#fff;font-size:12px;padding:4px 10px;border-radius:6px;z-index:9}
nav{padding-block:22px;font-weight:800;font-size:22px}
h1{font-weight:800;font-size:clamp(34px,5vw,60px);line-height:1.2;margin:20px 0 10px;max-width:16ch}
.lead{color:var(--muted);margin:0 0 34px;max-width:46ch}
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;gap:14px;padding-bottom:70px}
.c{background:var(--card);border-radius:22px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.c h3{margin:0;font-size:16px}.c small{color:var(--muted)}
.big{grid-column:span 2;grid-row:span 2}.wide{grid-column:span 2}
.bal{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:end;gap:8px;height:120px}.bars i{flex:1;background:var(--accent);border-radius:6px 6px 0 0;opacity:.85;height:var(--h);animation:g 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes g{from{height:8%}}@media(prefers-reduced-motion:reduce){.bars i{animation:none}}
.mint{background:var(--mint)}.mint b{color:var(--good);font-size:28px}
.pill{display:flex;gap:8px;flex-wrap:wrap}.pill span{background:var(--bg);border-radius:99px;padding:4px 12px;font-size:13px}
@media(max-width:760px){.bento{grid-template-columns:1fr 1fr}.big{grid-column:1/-1}.wide{grid-column:1/-1}}
</style></head><body><span class="tag">مثال تصميم · تطبيق افتراضي · أرقام للتوضيح</span>
<div class="w"><nav>جيبي</nav><h1>فلوسك قدامك، من غير جداول</h1><p class="lead">اربط حسابك وكارتك، وجيبي يقسم مصاريفك لوحده ويقولك فاضل كام لآخر الشهر.</p>
<div class="bento"><div class="c big"><small>مصاريف أكتوبر</small><div class="bars"><i style="--h:40%"></i><i style="--h:65%"></i><i style="--h:30%"></i><i style="--h:80%"></i><i style="--h:55%"></i><i style="--h:45%"></i><i style="--h:70%"></i></div><h3>أكتر يوم صرفت فيه: الخميس</h3></div>
<div class="c"><small>فاضل لآخر الشهر</small><div class="bal">٣٬٢٠٠</div></div><div class="c mint"><small>وفّرت الشهر ده</small><b>+٨٥٠ ج</b></div>
<div class="c wide"><h3>تصنيف لوحده</h3><div class="pill"><span>أكل</span><span>مواصلات</span><span>فواتير</span><span>هدايا</span></div></div></div></div></body></html>
