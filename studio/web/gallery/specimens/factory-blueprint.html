<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مضخة نَبع — مثال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#0F2A44;--ink:#E6F0FA;--muted:#9DB4CC;--line:#2D4C6E;--accent:#FFB547}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.w{max-width:1160px;margin:auto;padding-inline:max(20px,4vw)}
.tag{position:fixed;inset:auto auto 12px 12px;background:var(--accent);color:var(--bg);font-size:12px;padding:4px 10px;z-index:9}
nav{display:flex;justify-content:space-between;padding-block:20px;font-weight:700}nav span{font:13px "IBM Plex Mono";color:var(--muted);direction:ltr}
.hero{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:center;padding-block:30px 50px}
h1{font-size:clamp(34px,4.6vw,58px);line-height:1.2;margin:0 0 14px}p{color:var(--muted);margin:0 0 22px;max-width:42ch}
.btn{border:2px solid var(--accent);color:var(--accent);padding:11px 22px;text-decoration:none;font-weight:600;display:inline-block}
svg{width:100%;height:auto;max-width:100%;direction:ltr}svg text{fill:var(--ink);font:13px "IBM Plex Sans Arabic"}
.part{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.x .p1{transform:translate(0,-34px)}.x .p2{transform:translate(-40px,0)}.x .p3{transform:translate(0,30px)}
@media(prefers-reduced-motion:reduce){.part{transition:none}}
.spec{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--muted);margin-bottom:60px}
.spec div{padding:16px 0}.spec b{display:block;font:600 24px "IBM Plex Mono";color:var(--accent);direction:ltr;text-align:right}.spec span{font-size:14px;color:var(--muted)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.spec{grid-template-columns:1fr 1fr}}
</style></head><body><span class="tag">مثال تصميم · منتج افتراضي</span>
<div class="w"><nav>نَبع للصناعات <span>MODEL NB-40</span></nav>
<section class="hero"><div><h1>مضخة بتتفك قدامك قبل ما تشتريها</h1><p>دوس على الزرار والأجزاء تتفرّق، عشان تعرف كل قطعة بتعمل إيه وقطع غيارها متاحة ولا لأ.</p><a class="btn" href="#" onclick="document.getElementById('m').classList.toggle('x');return false">فكّ / ركّب</a></div>
<svg id="m" class="x" viewBox="0 0 520 300" role="img" aria-label="رسم مبسط لمضخة مفككة: الموتور والجسم وقاعدة التثبيت">
<g class="part p1"><rect x="190" y="40" width="160" height="70" rx="8" fill="none" stroke="#E6F0FA" stroke-width="2"/><text x="370" y="80">الموتور ٤ كيلووات</text></g>
<g class="part p2"><circle cx="200" cy="170" r="52" fill="none" stroke="#FFB547" stroke-width="2"/><circle cx="200" cy="170" r="16" fill="#FFB547"/><text x="40" y="175">الريشة</text></g>
<g class="part"><rect x="260" y="130" width="110" height="80" rx="6" fill="none" stroke="#E6F0FA" stroke-width="2"/><text x="385" y="175">الجسم زهر</text></g>
<g class="part p3"><rect x="150" y="235" width="260" height="22" fill="none" stroke="#9DB4CC" stroke-width="2"/><text x="420" y="252">القاعدة</text></g></svg></section>
<section class="spec"><div><b>40 m³/h</b><span>التصرّف</span></div><div><b>32 m</b><span>أقصى رفع</span></div><div><b>4 kW</b><span>القدرة</span></div><div><b>2 yr</b><span>الضمان</span></div></section></div></body></html>
