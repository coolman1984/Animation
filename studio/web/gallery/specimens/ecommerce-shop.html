<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نَول — مثال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Readex+Pro:wght@400;500&display=swap">
<style>
:root{--bg:#F6F3EF;--card:#fff;--ink:#1E1B18;--muted:#6A625A;--accent:#5B3A8C;--line:#E4DED6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Readex Pro",system-ui,sans-serif}
.w{max-width:1180px;margin:auto;padding-inline:max(20px,3vw)}
.tag{position:fixed;inset:auto auto 12px 12px;background:var(--accent);color:#fff;font-size:12px;padding:4px 10px;border-radius:4px;z-index:9}
nav{display:flex;justify-content:space-between;align-items:center;padding-block:18px;border-bottom:1px solid var(--line)}nav b{font:700 26px "El Messiri"}
.cart{border:1px solid var(--ink);border-radius:99px;padding:6px 14px;font-size:14px}
.head{display:flex;justify-content:space-between;align-items:end;padding-block:36px 20px;flex-wrap:wrap;gap:12px}
h1{font:700 clamp(32px,4.4vw,52px)/1.2 "El Messiri";margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.filters .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-bottom:60px}
.pr{min-width:0}.pr .img{aspect-ratio:3/4;border-radius:14px;background:var(--c);position:relative;overflow:hidden}
.pr .img:after{content:"";position:absolute;inset:18% 22%;border-radius:40% 40% 10% 10%;background:rgba(255,255,255,.35)}
.pr h3{margin:10px 0 0;font-size:15px;font-weight:500}.pr p{margin:0;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.pr button{margin-top:8px;font:inherit;font-size:14px;background:none;border:0;border-bottom:1px solid var(--accent);color:var(--accent);padding:2px 0;cursor:pointer}
@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><span class="tag">مثال تصميم · متجر افتراضي</span>
<div class="w"><nav><b>نَول</b><span class="cart" id="cart">السلة (٠)</span></nav>
<div class="head"><h1>شيلان منسوجة على النول</h1><div class="filters"><button class="on">الكل</button><button>قطن</button><button>كتان</button><button>صوف</button></div></div>
<div class="grid">
<div class="pr"><div class="img" style="--c:#C9A27E"></div><h3>شال أخميم رملي</h3><p>٨٥٠ ج</p><button>أضف للسلة</button></div>
<div class="pr"><div class="img" style="--c:#6E7F5C"></div><h3>كتان زيتوني</h3><p>٦٢٠ ج</p><button>أضف للسلة</button></div>
<div class="pr"><div class="img" style="--c:#8C4A3C"></div><h3>صوف قرميدي</h3><p>٩٤٠ ج</p><button>أضف للسلة</button></div>
<div class="pr"><div class="img" style="--c:#3F4A66"></div><h3>قطن نيلي</h3><p>٥٥٠ ج</p><button>أضف للسلة</button></div></div></div>
<script>let n=0;const d=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];document.querySelectorAll('.pr button').forEach(b=>b.onclick=()=>{n++;document.getElementById('cart').textContent='السلة ('+String(n).replace(/\d/g,x=>d[x])+')'});
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b))});</script></body></html>
