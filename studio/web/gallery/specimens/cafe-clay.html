<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بُنّ الحارة — مثال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;600&display=swap">
<style>
:root{--bg:#C9784A;--card:#F7EEE3;--ink:#22160E;--muted:#5B4232;--deep:#7A3E1E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Readex Pro",system-ui,sans-serif}
.w{max-width:1100px;margin:auto;padding-inline:max(20px,4vw)}
.tag{position:fixed;inset:auto auto 12px 12px;background:var(--ink);color:var(--card);font-size:12px;padding:4px 10px;border-radius:4px;z-index:9}
header{padding-block:56px 36px;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end}
h1{font:400 clamp(56px,9vw,120px)/.95 Lalezar,sans-serif;margin:0;color:var(--card)}
header p{margin:14px 0 0;max-width:36ch}
.cup{width:180px;height:180px;border-radius:50%;background:var(--card);box-shadow:inset -18px -18px 0 #E6D3BE,0 24px 0 -8px var(--deep);display:grid;place-items:center}
.cup i{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#8A4A26,#3B1F10)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding-bottom:70px}
.it{background:var(--card);border-radius:24px;padding:22px 24px;box-shadow:0 8px 0 var(--deep)}
.it div{display:flex;justify-content:space-between;align-items:baseline}.it h3{margin:0;font:400 28px Lalezar,sans-serif}
.it b{font-variant-numeric:tabular-nums}.it p{margin:6px 0 0;color:var(--muted);font-size:15px}
@media(max-width:600px){header{grid-template-columns:1fr}.cup{width:120px;height:120px}.cup i{width:70px;height:70px}}
</style></head><body><span class="tag">مثال تصميم · قهوة افتراضية</span>
<div class="w"><header><div><h1>بُنّ الحارة</h1><p>قهوة محمّصة كل خميس في الدكان نفسه. اقعد أو خد معاك.</p></div><div class="cup"><i></i></div></header>
<section class="menu"><div class="it"><div><h3>تركي مظبوط</h3><b>٣٥ ج</b></div><p>على الرملة، بوش تقيل.</p></div><div class="it"><div><h3>فلات وايت</h3><b>٧٠ ج</b></div><p>دبل شوت ولبن ناعم.</p></div><div class="it"><div><h3>كولد برو</h3><b>٨٠ ج</b></div><p>متنقوع ١٦ ساعة.</p></div><div class="it"><div><h3>شاي كشري</h3><b>٢٥ ج</b></div><p>بالنعناع لو تحب.</p></div></section></div></body></html>
