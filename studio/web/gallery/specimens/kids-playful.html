<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حروفي — مثال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap">
<style>
:root{--bg:#FFF6D9;--ink:#1D2A5B;--muted:#46507A;--yel:#FFC83D;--blue:#3B6CFF;--pink:#FF6F91;--green:#2FBF71}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Baloo Bhaijaan 2",system-ui,sans-serif;overflow-x:hidden}
.w{max-width:1100px;margin:auto;padding-inline:max(20px,4vw)}
.tag{position:fixed;inset:auto auto 12px 12px;background:var(--ink);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px;z-index:9}
nav{padding-block:20px;font:400 32px Lalezar;color:var(--blue)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;padding-block:30px 60px}
h1{font:400 clamp(44px,6.5vw,86px)/1.05 Lalezar;margin:0 0 14px}
h1 span{color:var(--pink)}p{color:var(--muted);margin:0 0 24px;max-width:38ch}
.btn{background:var(--blue);color:#fff;font-weight:800;padding:14px 28px;border-radius:20px;text-decoration:none;display:inline-block;box-shadow:0 6px 0 #1E3FB0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.t{aspect-ratio:1;border-radius:28px;display:grid;place-items:center;font:400 clamp(48px,7vw,84px) Lalezar;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.15);transform:rotate(var(--r))}
.t:nth-child(1){background:var(--pink);--r:-6deg}.t:nth-child(2){background:var(--yel);color:var(--ink);--r:4deg}.t:nth-child(3){background:var(--green);--r:-3deg}
.t:nth-child(4){background:var(--blue);--r:5deg}.t:nth-child(5){background:var(--ink);--r:-4deg}.t:nth-child(6){background:var(--pink);--r:3deg}
.t:hover{animation:wig .5s}@keyframes wig{50%{transform:rotate(0) scale(1.06)}}
.age{display:flex;gap:12px;flex-wrap:wrap;padding-bottom:60px}.age b{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:8px 18px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
</style></head><body><span class="tag">مثال تصميم · تطبيق افتراضي</span>
<div class="w"><nav>حروفي</nav><section class="hero"><div><h1>الحروف <span>بتلعب</span> مع ابنك</h1><p>١٠ دقايق في اليوم: يسمع الحرف، يرسمه بصباعه، ويلاقيه في كلمة. من غير إعلانات.</p><a class="btn" href="#">جرّب أول ٥ حروف</a></div>
<div class="tiles"><div class="t">أ</div><div class="t">ب</div><div class="t">ت</div><div class="t">ث</div><div class="t">ج</div><div class="t">ح</div></div></section>
<div class="age"><b>من ٤ لـ ٧ سنين</b><b>بيشتغل من غير نت</b><b>تقرير أسبوعي للأهل</b></div></div></body></html>
