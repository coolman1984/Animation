<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عُود سِرّ — مثال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500&display=swap">
<style>
:root{--bg:#0E0C0A;--ink:#EFE6D8;--muted:#A89A86;--gold:#C8A96A;--line:#2C261F}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.9 "Noto Naskh Arabic",serif}
.w{max-width:1000px;margin:auto;padding-inline:max(24px,5vw);text-align:center}
.tag{position:fixed;inset:auto auto 12px 12px;border:1px solid var(--gold);color:var(--gold);font-size:12px;padding:4px 10px;z-index:9;background:var(--bg)}
nav{padding-block:30px;font:700 22px Amiri,serif;letter-spacing:.04em;color:var(--gold)}
.bottle{margin:30px auto 0;width:120px;height:210px;position:relative}
.bottle:before{content:"";position:absolute;inset:0 30px auto;height:44px;background:linear-gradient(90deg,#6E5A35,var(--gold),#6E5A35);border-radius:4px 4px 0 0}
.bottle:after{content:"";position:absolute;inset:44px 0 0;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(200,169,106,.05),rgba(200,169,106,.28));border-radius:6px}
h1{font:400 clamp(44px,7vw,92px)/1.15 Amiri,serif;margin:36px 0 10px}
.lead{color:var(--muted);max-width:40ch;margin:0 auto 34px}
.btn{color:var(--gold);border-bottom:1px solid var(--gold);text-decoration:none;padding-bottom:4px}
.notes{display:flex;justify-content:center;gap:60px;margin:80px 0;border-top:1px solid var(--line);padding-top:40px;flex-wrap:wrap}
.notes b{display:block;font:700 26px Amiri,serif;color:var(--gold)}.notes span{color:var(--muted);font-size:15px}
.reveal{animation:up 1.6s cubic-bezier(.2,.7,.2,1) both}@keyframes up{from{opacity:.0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){.reveal{animation:none}}
</style></head><body><span class="tag">مثال تصميم · ماركة افتراضية</span>
<div class="w"><nav>عُود سِرّ</nav><div class="bottle reveal"></div><h1>ريحة بتفضل بعد ما تمشي</h1><p class="lead">٥٠ مل. عود كمبودي، ورد طائفي، وعنبر. معمول على دفعات صغيرة، كل زجاجة مترقّمة بإيد.</p><a class="btn" href="#">اطلب عيّنة</a>
<div class="notes"><div><b>المقدمة</b><span>زعفران، هيل</span></div><div><b>القلب</b><span>ورد طائفي</span></div><div><b>القاعدة</b><span>عود، عنبر</span></div></div></div></body></html>
