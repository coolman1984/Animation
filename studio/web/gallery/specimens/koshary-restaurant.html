<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كشري المَعلّم — مثال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700&display=swap">
<style>
:root{--bg:#FFF8EC;--ink:#2A1608;--muted:#6B4A30;--red:#B3261E;--green:#1F6B3A;--line:#E8D6BE}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Cairo,system-ui,sans-serif}
.w{max-width:980px;margin:auto;padding-inline:max(20px,4vw)}
.tag{position:fixed;inset:auto auto 12px 12px;background:var(--red);color:#fff;font-size:12px;padding:4px 10px;border-radius:4px;z-index:9}
.sign{text-align:center;padding-block:50px 24px;border-bottom:3px double var(--red)}
.sign small{color:var(--green);font-weight:700;letter-spacing:.02em}
h1{font:700 clamp(56px,10vw,120px)/1.1 "Aref Ruqaa",serif;margin:6px 0;color:var(--red)}
.sign p{margin:0;color:var(--muted)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px 60px;padding-block:36px}
.menu h2{grid-column:1/-1;font:700 34px "Aref Ruqaa";margin:10px 0 0;color:var(--green)}
.row{display:flex;align-items:baseline;gap:10px}.row span{flex:1;border-bottom:2px dotted var(--line)}.row b{font-variant-numeric:tabular-nums}
.call{background:var(--green);color:#fff;border-radius:16px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:60px}
.call b{font-size:24px;direction:ltr;user-select:all}
@media(max-width:640px){.menu{grid-template-columns:1fr}}
</style></head><body><span class="tag">مثال تصميم · مطعم افتراضي · الأسعار للتوضيح</span>

<h2>الحلو</h2><div class="row">رز بلبن<span></span><b>٢٥ ج</b></div><div class="row">أم علي<span></span><b>٤٠ ج</b></div></section>
<div class="call"><span>دليفري لحد الساعة ٢ بالليل</span><b>19XXX</b></div></div></body></html>
